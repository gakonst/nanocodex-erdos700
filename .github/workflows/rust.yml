name: Rust harness

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out research harness
        uses: actions/checkout@v4
        with:
          path: nanocodex-erdos700
      - name: Check out Nanocodex master
        uses: actions/checkout@v4
        with:
          repository: gakonst/nanocodex
          ref: master
          path: nanocodex-latest
      - name: Install Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo +1.88.0 fmt --check
        working-directory: nanocodex-erdos700
      - name: Run tests
        run: cargo +1.88.0 test --all-targets
        working-directory: nanocodex-erdos700
