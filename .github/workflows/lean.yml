name: Lean proof

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Set up Lean and build
        uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false
      - name: Verify theorem dependencies
        run: ./scripts/verify.sh
