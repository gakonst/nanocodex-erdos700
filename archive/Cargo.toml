[package]
name = "nanocodex-erdos"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
default-run = "nanocodex-erdos"
publish = false
license = "MIT OR Apache-2.0"
description = "Research harness and knowledge base for AI-assisted mathematics with Nanocodex"

[dependencies]
clap = { version = "4.5.54", features = ["derive", "env"] }
dotenvy = "0.15.7"
eyre = "0.6.12"
futures = "0.3.33"
nanocodex = { path = "../nanocodex-latest/crates/nanocodex" }
nanocodex-tools = { path = "../nanocodex-latest/crates/nanocodex-tools" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tokio = { version = "1.48.0", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }

[build-dependencies]
sha2 = "0.10.9"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
